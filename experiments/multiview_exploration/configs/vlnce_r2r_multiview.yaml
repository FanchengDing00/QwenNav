# @package _global_
# Experiment-only R2R config. Exploration uses real velocity-control rotations;
# the simulator exposes only the same official front RGB/depth sensors as normal eval.

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/task/actions@habitat.task.actions.velocity_control: velocity_control
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset: dataset_config_schema
  - _self_

habitat:
  environment:
    max_episode_steps: 500

  task:
    actions:
      velocity_control:
        lin_vel_range: [0.0, 2.5]
        ang_vel_range: [-300.0, 300.0]
        min_abs_lin_speed: 0.01
        min_abs_ang_speed: 0.5
        time_step: 0.1

  dataset:
    type: VLN-CE-v1
    split: val_unseen
    data_path: "data/datasets/R2R_VLNCE_v1-3_preprocessed/{split}/{split}.json.gz"
    scenes_dir: "data/scene_datasets/"

  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 480
            height: 270
            hfov: 120
            type: HabitatSimRGBSensor
            position: [0, 0.88, 0]
          depth_sensor:
            width: 480
            height: 270
            hfov: 120
            type: HabitatSimDepthSensor
            position: [0, 0.88, 0]
    forward_step_size: 0.25
    turn_angle: 15
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: true
